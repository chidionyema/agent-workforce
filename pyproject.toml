[project]
name = "infra-crew"
version = "0.1.0"
description = "A brand-new infra crew on crewAI: plans, builds and verifies platform work to a green pull request, then stops. It has no merge, deploy or cluster hand."
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai==1.9.3",
    "requests>=2.32",
    "pyyaml>=6",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-crewai>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
infra-crew = "infra_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra_crew"]

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
