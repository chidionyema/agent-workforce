[project]
name = "agent-workforce"
version = "0.1.0"
description = "A brand-new agent workforce on crewAI: plans, builds and verifies platform work to a green pull request, then stops. It has no merge, deploy or cluster hand."
requires-python = ">=3.11,<3.13"
dependencies = [
    # crew#854 / crew#850 CP5: crewai 1.15.20. The chain to get here was measured, not guessed:
    # 1.9.3 crashed its own task-output guardrail (prose instead of strict JSON -> the lane
    # delivered nothing); 1.10.1 cleared the dependency banner but the LLMGuardrail call itself
    # still made the verifier model return markdown-fenced JSON, which failed the same parse. A
    # live router probe (fast lane) proved the lane WILL return clean JSON under a
    # response_format call; 1.15.20's guardrail issues that call natively, which is why the
    # upgrade is the fix and a pin bump alone was not. 2026-09-08.
    #
    # The reasoning/planning/crew.test enhancement layer of #854 is sequenced behind the CP4
    # memory change (crew#853) and NOT yet enabled here; this pin lands the framework upgrade
    # and its forced breaking changes, which is the activation need.
    "crewai==1.15.20",
    "crewai-tools==1.15.20",
    "requests>=2.32",
    "pyyaml>=6",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-crewai>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agent-workforce = "agent_workforce.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workforce"]

[tool.crewai]
type = "crew"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "B", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
