name: Pi pinned egress research fixture
on:
  push:
    branches: [research/pi-egress-fixture-20261126]
    paths: ['.github/workflows/pi-egress-fixture.yml']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install exact production harness without model credentials
        run: npm install -g --silent @earendil-works/pi-coding-agent@0.86.1
      - name: Prove actual CLI and custom provider streaming tool loop
        run: |
          python3 - <<'PY'
          import http.server, json, os, pathlib, subprocess, tempfile, threading
          from urllib.parse import urlsplit
          calls = []
          model = "nvidia/nemotron-3.5-lightning:free"
          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, *_):
                  pass
              def do_POST(self):
                  if self.path != "/v1/chat/completions":
                      self.send_error(404)
                      return
                  if self.headers.get("Authorization") != "Bearer fixture-key":
                      self.send_error(401)
                      return
                  body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  tools = [x.get("function", {}).get("name") for x in body.get("tools", [])]
                  calls.append({"model_matches":body.get("model") == model, "stream":body.get("stream"), "tools":tools, "max_tokens":body.get("max_tokens"), "tool_result":any(x.get("role") == "tool" for x in body.get("messages", []))})
                  if body.get("model") != model or not body.get("stream"):
                      self.send_error(400)
                      return
                  if len(calls) == 1:
                      delta = {"role":"assistant","tool_calls":[{"index":0,"id":"call_fixture","type":"function","function":{"name":"write","arguments":json.dumps({"path":"witness.txt","content":"fixture-ok\n"})}}]}
                      finish = "tool_calls"
                  else:
                      delta = {"role":"assistant","content":"FIXTURE_DONE"}
                      finish = "stop"
                  self.send_response(200)
                  self.send_header("Content-Type","text/event-stream")
                  self.send_header("Connection","close")
                  self.end_headers()
                  for d,f in [(delta,None),({},finish)]:
                      chunk = {"id":"fixture","object":"chat.completion.chunk","created":1,"model":model,"choices":[{"index":0,"delta":d,"finish_reason":f}]}
                      self.wfile.write(("data: "+json.dumps(chunk)+"\n\n").encode())
                  self.wfile.write(b"data: [DONE]\n\n")
                  self.wfile.flush()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              config = root / "config"
              config.mkdir(mode=0o700)
              (root/"sessions").mkdir()
              (root/"home").mkdir()
              server = http.server.ThreadingHTTPServer(("127.0.0.1",0),Handler)
              thread = threading.Thread(target=server.serve_forever,daemon=True)
              thread.start()
              (config/"models.json").write_text(json.dumps({"providers":{"estate-admitted":{"baseUrl":f"http://127.0.0.1:{server.server_port}/v1","api":"openai-completions","apiKey":"$LEGION_SELECTED_KEY","models":[{"id":model,"name":model,"contextWindow":32768,"maxTokens":4096,"input":["text"],"reasoning":False}]}}}))
              env = {k:v for k,v in os.environ.items() if k in ("PATH","LANG","LC_ALL","TERM","TMPDIR")}
              env.update(HOME=str(root/"home"),PI_CODING_AGENT_DIR=str(config),LEGION_SELECTED_KEY="fixture-key",NO_PROXY="127.0.0.1,localhost")
              try:
                  result = subprocess.run(["pi","-p","--provider","estate-admitted","--model",model,"--session-dir",str(root/"sessions"),"Create witness.txt with the text fixture-ok and finish."],cwd=root,env=env,capture_output=True,text=True,timeout=60)
                  print("FIXTURE_RECEIPT",json.dumps({"exit":result.returncode,"calls":calls,"stdout":result.stdout[-1200:],"stderr":result.stderr[-1200:],"witness":(root/"witness.txt").is_file()}))
                  assert result.returncode == 0
                  assert len(calls) == 2 and all(x["model_matches"] and x["stream"] for x in calls)
                  assert "write" in calls[0]["tools"] and calls[1]["tool_result"]
                  assert (root/"witness.txt").read_text() == "fixture-ok\n"
                  print("REAL_CLI_LOOPBACK_TOOL_EFFECT_PASS")
              finally:
                  server.shutdown()
                  server.server_close()
          PY
