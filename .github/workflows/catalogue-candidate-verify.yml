name: Catalogue exact-source deterministic verification
on:
  push:
    branches: [research/pi-egress-fixture-20261126]
    paths: ['.github/workflows/catalogue-candidate-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chidionyema/idp
          ref: bcc343266d3c069762c2c52305b3bd04418aadb4
          path: idp-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /platform/llm/catalog_gate.py
            /tests/test_catalog_gate.py
            /pyproject.toml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install the estate's exact gate tools and actual provider adapter
        run: python -m pip install -q ruff==0.15.18 pytest==8.4.2 pyyaml litellm==1.100.4
      - name: Exact source and deterministic preseal checks
        working-directory: idp-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bcc343266d3c069762c2c52305b3bd04418aadb4
          test "$(git hash-object platform/llm/catalog_gate.py)" = 796cf8ffd3b246cb4069172dedfc84c73e508012
          test "$(git hash-object tests/test_catalog_gate.py)" = 6a0909b347aa1f25d475823b48474c23a172093a
          ruff format platform/llm/catalog_gate.py tests/test_catalog_gate.py
          ruff check --select E9,F,B,S platform/llm/catalog_gate.py tests/test_catalog_gate.py
          ruff format --check platform/llm/catalog_gate.py tests/test_catalog_gate.py
          python -W error -m py_compile platform/llm/catalog_gate.py tests/test_catalog_gate.py
          python -m pytest --noconftest -q tests/test_catalog_gate.py
          git diff --check
          echo "NORMALIZED_BLOBS $(git hash-object platform/llm/catalog_gate.py) $(git hash-object tests/test_catalog_gate.py)"
          git diff -- platform/llm/catalog_gate.py tests/test_catalog_gate.py
      - name: Actual pinned LiteLLM route falsifier, loopback TLS only
        working-directory: idp-source
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 3b9125097de7adcdbcb488ddb71d2fe1bc8da0c8
          git show FETCH_HEAD:platform/llm/catalog_gate.py > "$RUNNER_TEMP/catalog-baseline.py"
          python - <<'PY'
          import http.server, importlib.util, json, os, pathlib, socket, ssl, subprocess, tempfile, threading
          import importlib.metadata
          assert importlib.metadata.version("litellm")=="1.100.4"
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod
          calls=[]
          model="fixture-model"
          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self,*_): pass
              def do_POST(self):
                  body=json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  assert self.path=="/v1/chat/completions",self.path
                  assert self.headers.get("Authorization")=="Bearer synthetic-fixture-key"
                  assert body["model"]==model,body["model"]
                  calls.append(self.server.label)
                  raw=json.dumps({"id":"fixture","object":"chat.completion","created":1,"model":model,"choices":[{"index":0,"message":{"role":"assistant","content":"1"},"finish_reason":"stop"}],"usage":{"prompt_tokens":1,"completion_tokens":1,"total_tokens":2}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length",str(len(raw)))
                  self.end_headers()
                  self.wfile.write(raw)
          with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)
              cert,key=p/"fixture.crt",p/"fixture.key"
              subprocess.run(["openssl","req","-x509","-newkey","rsa:2048","-nodes","-days","1","-subj","/CN=127.0.0.1","-addext","subjectAltName=IP:127.0.0.1","-keyout",str(key),"-out",str(cert)],check=True,capture_output=True)
              servers=[]
              for name in ("default","explicit"):
                  server=http.server.ThreadingHTTPServer(("127.0.0.1",0),Handler)
                  server.label=name
                  ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
                  ctx.load_cert_chain(cert,key)
                  server.socket=ctx.wrap_socket(server.socket,server_side=True)
                  threading.Thread(target=server.serve_forever,daemon=True).start()
                  servers.append(server)
              def url(s): return f"https://127.0.0.1:{s.server_port}/v1"
              os.environ.update(SSL_CERT_FILE=str(cert),REQUESTS_CA_BUNDLE=str(cert),OPENAI_API_BASE=url(servers[0]),OPENAI_BASE_URL=url(servers[0]),LITELLM_LOCAL_MODEL_COST_MAP="True",LITELLM_LOG="ERROR",NO_PROXY="*",FIXTURE_KEY="synthetic-fixture-key")
              # The real adapter cannot reach a vendor, even if the fallback is wrong.
              getaddrinfo=socket.getaddrinfo
              connect=socket.socket.connect
              def local(host):
                  if isinstance(host,bytes): host=host.decode()
                  return host in ("127.0.0.1","::1","localhost")
              def guarded_dns(host,*a,**kw):
                  if not local(host): raise OSError("non-loopback DNS refused")
                  return getaddrinfo(host,*a,**kw)
              def guarded_connect(sock,addr):
                  if isinstance(addr,tuple) and not local(addr[0]): raise OSError("non-loopback connection refused")
                  return connect(sock,addr)
              socket.getaddrinfo=guarded_dns
              socket.socket.connect=guarded_connect
              try:
                  import litellm
                  litellm.api_base=url(servers[0])
                  cfg=p/"config.yaml"
                  cfg.write_text("model_list:\n  - model_name: fixture\n    litellm_params:\n      model: openai/fixture-model\n      api_key: os.environ/FIXTURE_KEY\n      api_base: "+url(servers[1])+"\n")
                  baseline=load("baseline",pathlib.Path(os.environ["RUNNER_TEMP"])/"catalog-baseline.py")
                  candidate=load("candidate",pathlib.Path("platform/llm/catalog_gate.py"))
                  old=baseline.probe(baseline._lanes(cfg)[0])
                  new=candidate.probe(candidate._lanes(cfg)[0])
                  print("REAL_ADAPTER_RECEIPT",json.dumps({"baseline":old["status"],"candidate":new["status"],"observed_endpoints":calls}))
                  assert old["status"]=="GREEN" and new["status"]=="GREEN",(old["status"],new["status"])
                  assert calls==["default","explicit"],calls
                  print("CONFIGURED_ENDPOINT_CAUSAL_FALSIFIER_PASS")
              finally:
                  socket.getaddrinfo=getaddrinfo
                  socket.socket.connect=connect
                  for server in servers:
                      server.shutdown()
                      server.server_close()
          PY
