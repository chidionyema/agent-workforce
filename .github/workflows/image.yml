name: image

# Every commit on main becomes an image the cluster can pull. The workload manifest in idp pins
# the tag; the founder merges that pin. Nothing here deploys.

on:
  push:
    branches: [main]
  # Renaming the repository does not rename the container package: `github.repository` is read
  # when a run starts, so the image only moves to the new name on the next publish. This lets
  # that publish be asked for without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
