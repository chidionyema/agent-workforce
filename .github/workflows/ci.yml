name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CREWAI_DISABLE_TELEMETRY: "true"
  OTEL_SDK_DISABLED: "true"

jobs:
  prove:
    name: no deploy hands, boots only when seen, no literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: The crew has no merge, deploy or cluster hand
        run: pytest tests/test_no_deploy_hands.py
      - name: The crew refuses to boot dark
        run: pytest tests/test_boot_refuses_dark.py
      - name: Nothing names where the estate lives
        run: pytest tests/test_config_no_literals.py tests/test_tools_write_only_own_branch.py

  image:
    name: image builds and refuses to boot dark
    runs-on: ubuntu-latest
    needs: prove
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t infra-crew:ci .
      - name: A dark container exits 3 with a REFUSED line
        run: |
          set +e
          out=$(docker run --rm infra-crew:ci 1 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 3 && echo "$out" | grep -q '^REFUSED:'
