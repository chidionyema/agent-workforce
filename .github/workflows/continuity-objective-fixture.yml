name: Continuity objective fixture
on:
  push:
    branches:
      - research/continuity-objective-fixture-20261126
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chidionyema/idp
          ref: 28804dbc8d3a420a74b7efe2c7cfd0ef384bb702
          path: idp
          persist-credentials: false
          sparse-checkout: |
            platform/estate
            tests/estate/test_continuity_conserved_objective.py
            tests/estate/test_continuity_control.py
            tests/test_continuity_operating_receipt.py
            tests/test_continuity_retry_budget.py
            pyproject.toml
          sparse-checkout-cone-mode: false
      - name: Execute exact candidate falsifier
        working-directory: idp
        run: |
          test "$(git rev-parse HEAD)" = 28804dbc8d3a420a74b7efe2c7cfd0ef384bb702
          python3 -m venv "$RUNNER_TEMP/continuity"
          "$RUNNER_TEMP/continuity/bin/pip" install pytest==8.3.5 cryptography==44.0.3 ruff==0.11.13
          "$RUNNER_TEMP/continuity/bin/ruff" check --select E9,F,B,S platform/estate/continuity/accept_txn.py platform/estate/continuity/checkpoints.py platform/estate/continuity/control.py platform/estate/continuity/store.py tests/estate/test_continuity_conserved_objective.py tests/estate/test_continuity_control.py
          "$RUNNER_TEMP/continuity/bin/ruff" format --diff platform/estate/continuity/accept_txn.py platform/estate/continuity/checkpoints.py platform/estate/continuity/control.py platform/estate/continuity/store.py tests/estate/test_continuity_conserved_objective.py tests/estate/test_continuity_control.py
          "$RUNNER_TEMP/continuity/bin/python" -m pytest -q tests/estate/test_continuity_conserved_objective.py tests/estate/test_continuity_control.py tests/test_continuity_operating_receipt.py tests/test_continuity_retry_budget.py
          "$RUNNER_TEMP/continuity/bin/python" platform/estate/continuity/canary.py
